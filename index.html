<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nongbiw ♡</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ffe4ef,#fff5fa,#ffd6e8);
  color:#d94f8b;
  text-align:center;
  padding:24px 14px;
  position:relative;
  overflow-x:hidden;
}

/* ดาวจำนวนมาก */
.glow-bg{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}

.glow{
  position:absolute;
  width:14px;
  height:14px;
  animation:floatGlow 3s ease-in-out infinite;
  color:#ff3f9f;
  font-size:22px;
  font-weight:bold;
  text-shadow:
    0 0 6px #ff3f9f,
    0 0 14px #ff3f9f,
    0 0 25px #ff73b7,
    0 0 40px #ffb6d8;
}

.glow::before{
  content:"✦";
}

.glow.white{
  color:white;
  text-shadow:
    0 0 6px white,
    0 0 14px white,
    0 0 25px #ffeaf5,
    0 0 40px #ffc8e2;
}

/* ดาวขึ้นลงเร็ว */
@keyframes floatGlow{
  0%,100%{
    transform:translateY(0) translateX(0) rotate(0deg) scale(1);
    opacity:.65;
  }

  50%{
    transform:translateY(-45px) translateX(20px) rotate(20deg) scale(1.5);
    opacity:1;
  }
}

.container{
  max-width:460px;
  margin:auto;
  position:relative;
  z-index:1;
}

h1{
  font-size:30px;
  margin:12px 0;
}

.subtitle{
  font-size:19px;
  margin-bottom:24px;
}

.photo{
  width:180px;
  height:180px;
  object-fit:cover;
  border-radius:50%;
  border:6px solid white;
  box-shadow:0 5px 18px #e9a2c5;
}

.card{
  background:#ffffffd9;
  border:2px solid #ffc1dc;
  border-radius:25px;
  padding:20px;
  margin:18px 0;
  box-shadow:0 5px 14px #edb5cf55;
}

h2{
  font-size:21px;
  margin:4px 0 16px;
}

.contact{
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
  justify-content:center;
  margin:10px 0;
  flex-wrap:wrap;
}

.qr{
  width:115px;
  height:115px;
  object-fit:contain;
  border-radius:10px;
  background:white;
}

a{
  color:#d94f8b;
  overflow-wrap:anywhere;
  text-decoration:none;
}

.id{
  font-size:17px;
  font-weight:bold;
}

button{
  background:#f58db8;
  color:white;
  border:0;
  padding:12px 22px;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  transition: transform 0.2s, background 0.2s;
}

button:active {
  transform: scale(0.95);
}

.music{
  padding:14px;
}

.music h2{
  margin:4px 0 5px;
  font-size:18px;
}

.music p{
  font-size:13px;
  margin:5px 0 12px;
}

.music-btn {
  background: #ff69b4;
  font-weight: bold;
  box-shadow: 0 3px 10px rgba(255, 105, 180, 0.4);
}

.heart{
  font-size:22px;
}

footer{
  font-size:13px;
  padding:12px;
}
</style>
</head>

<script>
  const audio = document.getElementById('my-audio');
  const btn = document.getElementById('toggle-music');
  const statusText = document.getElementById('music-status');
  let isPlayed = false;

  function playAudio() {
    audio.play().then(() => {
      isPlayed = true;
      statusText.innerText = "🎀 กำลังเปิดเพลงให้ค่ะ ♡";
      btn.innerText = "⏸️ หยุดเพลง";
    }).catch(err => {
      console.log("Autoplay failed:", err);
    });
  }

  // กดปุ่มเปิด/ปิดเพลง
  btn.addEventListener('click', (e) => {
    e.stopPropagation(); // ไม่ให้สะท้อนไปที่ document
    if (audio.paused) {
      playAudio();
    } else {
      audio.pause();
      statusText.innerText = "🎀 ปิดเพลงอยู่ค่ะ ♡";
      btn.innerText = "▶️ เล่นเพลง";
    }
  });

  // แตะตรงไหนของหน้าจอก็ได้ เพลงจะเริ่มเล่นทันที (แก้ปัญหาโดน Safari/Chrome บล็อก Autoplay)
  document.addEventListener('click', () => {
    if (!isPlayed && audio.paused) {
      playAudio();
    }
  }, { once: true });
</script>
